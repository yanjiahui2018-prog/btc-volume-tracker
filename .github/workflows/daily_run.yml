name: DailyCryptoVolumeFetcher

on:
  schedule:
    - cron: '0 21 * * *'   # 每天 UTC 21:00（美股收盘后）自动执行
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          # 可选：在仓库 Settings > Secrets > Actions 中配置 CoinGlass API Key
          # 配置后衍生品成交量为真实数据，否则按现货量 2.5 倍估算
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python fetch_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update volume data $(date -u +%F)" || exit 0
          git push
